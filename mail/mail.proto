syntax = "proto3";

package mail;

option go_package = "github.com/HockeyNights/contracts/mail/langs/go;mail";

service MailService {
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
  rpc SendTemplateEmail(SendTemplateEmailRequest) returns (SendEmailResponse);
  rpc GetEmail(GetEmailRequest) returns (GetEmailResponse);
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
}

message SendEmailRequest {
  repeated string to = 1;
  string subject = 2;
  string text_body = 3;
  string html_body = 4;
  string from = 5;
}

message SendEmailResponse {
  string email_id = 1;
  string status = 2;
}

message SendTemplateEmailRequest {
  repeated string to = 1;
  string template_code = 2;
  map<string, string> variables = 3;
  string from = 4;
}

message GetEmailRequest {
  string email_id = 1;
}

message GetEmailResponse {
  EmailMessage email = 1;
}

message EmailMessage {
  string id = 1;
  repeated string to = 2;
  string from = 3;
  string subject = 4;
  string text_body = 5;
  string html_body = 6;
  string status = 7;
  int32 attempts = 8;
  int32 max_attempts = 9;
  string last_error = 10;
  string queued_at = 11;
  string sent_at = 12;
  string created_at = 13;
  string updated_at = 14;
  string template_code = 15;
  map<string, string> variables = 16;
}

message CreateTemplateRequest {
  string code = 1;
  string name = 2;
  string subject_template = 3;
  string text_body_template = 4;
  string html_body_template = 5;
  string from = 6;
}

message CreateTemplateResponse {
  EmailTemplate template = 1;
}

message GetTemplateRequest {
  string code = 1;
}

message GetTemplateResponse {
  EmailTemplate template = 1;
}

message EmailTemplate {
  string id = 1;
  string code = 2;
  string name = 3;
  string from = 4;
  string subject_template = 5;
  string text_body_template = 6;
  string html_body_template = 7;
  string created_at = 8;
  string updated_at = 9;
}
