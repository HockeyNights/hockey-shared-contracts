syntax = "proto3";

package team.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/HockeyNights/hockey-shared-contracts/team/gen/go/v1;teamv1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "HockeyNights Team API"
    version: "1.0.0"
    description: "Команды, состав и приглашения."
  }
};

service TeamService {
  rpc ListMyInvites(ListMyInvitesRequest) returns (InviteList) {
    option (google.api.http) = {get: "/v1/team-invites"};
  }
  rpc DeclineInvite(InviteActionRequest) returns (TeamInvite) {
    option (google.api.http) = {post: "/v1/team-invites/{invite_id}/decline" body: "*"};
  }
  rpc RevokeInvite(InviteActionRequest) returns (TeamInvite) {
    option (google.api.http) = {post: "/v1/team-invites/{invite_id}/revoke" body: "*"};
  }
  rpc ResendInvite(InviteActionRequest) returns (TeamInvite) {
    option (google.api.http) = {post: "/v1/team-invites/{invite_id}/resend" body: "*"};
  }
  rpc GetClub(GetClubRequest) returns (Club) {
    option (google.api.http) = {get: "/v1/clubs/{club_id}"};
  }
  rpc UpdateClub(UpdateClubRequest) returns (Club) {
    option (google.api.http) = {patch: "/v1/clubs/{club_id}" body: "*"};
  }
  rpc GetTeamClubProfile(GetTeamRequest) returns (ClubProfileResponse) {
    option (google.api.http) = {get: "/v1/teams/{team_id}/club-profile"};
  }
  rpc CreateStaffContact(CreateStaffContactRequest) returns (StaffContact) {
    option (google.api.http) = {post: "/v1/teams/{team_id}/staff-contact" body: "*"};
  }
  rpc ListStaffContacts(ListStaffContactsRequest) returns (StaffContactList) {
    option (google.api.http) = {get: "/v1/teams/{team_id}/staff-contact"};
  }
  // Internal methods authenticate services, have bounded output, and no HTTP annotations.
  rpc CheckTeamAccess(CheckTeamAccessRequest) returns (AccessDecision);
  rpc CheckClubAccess(CheckClubAccessRequest) returns (AccessDecision);
  rpc GetTeamMembers(GetTeamMembersRequest) returns (RosterList);
  rpc GetClubTeams(GetClubTeamsRequest) returns (ClubTeamsResponse);
  rpc BatchGetUserTeams(BatchGetUserTeamsRequest) returns (BatchGetUserTeamsResponse);
  rpc CreateTeam(CreateTeamRequest) returns (Team) {
    option (google.api.http) = {
      post: "/v1/teams"
      body: "*"
    };
  }

  rpc GetTeam(GetTeamRequest) returns (Team) {
    option (google.api.http) = {get: "/v1/teams/{team_id}"};
  }

  rpc UpdateTeam(UpdateTeamRequest) returns (Team) {
    option (google.api.http) = {
      patch: "/v1/teams/{team_id}"
      body: "*"
    };
  }

  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option (google.api.http) = {get: "/v1/teams"};
  }

  rpc GetRoster(GetRosterRequest) returns (RosterList) {
    option (google.api.http) = {get: "/v1/teams/{team_id}/roster"};
  }

  rpc AddMember(AddMemberRequest) returns (RosterMember) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/members"
      body: "*"
    };
  }

  rpc UpdateRosterStatus(UpdateRosterStatusRequest) returns (RosterMember) {
    option (google.api.http) = {
      patch: "/v1/teams/{team_id}/roster/{user_id}"
      body: "*"
    };
  }

  rpc UpdateTeamRole(UpdateTeamRoleRequest) returns (RosterMember) {
    option (google.api.http) = {
      patch: "/v1/teams/{team_id}/roles/{user_id}"
      body: "*"
    };
  }

  rpc ListInvites(ListInvitesRequest) returns (InviteList) {
    option (google.api.http) = {get: "/v1/teams/{team_id}/invites"};
  }

  rpc CreateEmailInvite(CreateEmailInviteRequest) returns (TeamInvite) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/invites"
      body: "*"
    };
  }

  rpc AcceptInvite(AcceptInviteRequest) returns (TeamInvite) {
    option (google.api.http) = {
      post: "/v1/team-invites/{invite_id}/accept"
      body: "*"
    };
  }
}

message BatchGetUserTeamsRequest { repeated string user_ids = 1; }
message UserTeams {
  string user_id = 1;
  repeated string team_ids = 2;
}
message BatchGetUserTeamsResponse { repeated UserTeams users = 1; }

message Team {
  string id = 1;
  string name = 2;
  string city = 3;
  string skill_level = 4;
  optional string description = 5;
  string captain_user_id = 6;
  string owner_user_id = 7;
  optional string league_id = 8;
  optional string home_arena_id = 9;
  repeated string member_ids = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional string short_description = 13;
  optional string logo_url = 14;
  optional string club_id = 15;
}

message RosterMember {
  string team_id = 1;
  string user_id = 2;
  string display_name = 3;
  string position = 4;
  string team_role = 5;
  string roster_status = 6;
  google.protobuf.Timestamp joined_at = 7;
}

message TeamInvite {
  string id = 1;
  string team_id = 2;
  optional string email = 3;
  optional string user_id = 4;
  optional string display_name = 5;
  string invited_by_user_id = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  string team_role = 11;
}

message CreateTeamRequest {
  string name = 1;
  string city = 2;
  string skill_level = 3;
  optional string description = 4;
  optional string captain_user_id = 5;
  optional string league_id = 6;
  optional string home_arena_id = 7;
  optional string short_description = 8;
  optional string logo_url = 9;
  repeated string player_ids = 10;
  repeated string coach_ids = 11;
  optional string club_id = 12;
  string idempotency_key = 13;
}

message GetTeamRequest {
  string team_id = 1;
}

message UpdateTeamRequest {
  string team_id = 1;
  optional string name = 2;
  optional string city = 3;
  optional string skill_level = 4;
  optional string description = 5;
  optional string captain_user_id = 6;
  optional string league_id = 7;
  optional string home_arena_id = 8;
  optional string short_description = 9;
  optional string logo_url = 10;
  optional string club_id = 11;
  // Clear nullable fields explicitly; absent fields are left unchanged.
  repeated string clear_fields = 12;
}

message ListTeamsRequest {
  string q = 1;
  string city = 2;
  string skill_level = 3;
  string user_id = 4;
  int32 limit = 5;
  int32 offset = 6;
  string league_id = 7;
  string player_id = 8; // Alias for user_id; conflicting aliases are rejected.
}

message ListTeamsResponse {
  repeated Team items = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetRosterRequest {
  string team_id = 1;
  bool include_removed = 2;
}

message RosterList {
  repeated RosterMember members = 1;
  int64 total = 2; int32 limit = 3; int32 offset = 4;
}

message AddMemberRequest {
  string team_id = 1;
  string user_id = 2;
  string team_role = 3; // player (default) or coach; never owner/captain/admin.
}

message UpdateRosterStatusRequest {
  string team_id = 1;
  string user_id = 2;
  string roster_status = 3;
}

message UpdateTeamRoleRequest {
  string team_id = 1;
  string user_id = 2;
  string team_role = 3;
}

message ListInvitesRequest {
  string team_id = 1;
  optional string status = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message InviteList {
  repeated TeamInvite invites = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message CreateEmailInviteRequest {
  string team_id = 1;
  string email = 2;
  string team_role = 3;
  string idempotency_key = 4;
}

message InviteActionRequest { string invite_id = 1; string idempotency_key = 2; }
message ListMyInvitesRequest { string status = 1; int32 limit = 2; int32 offset = 3; }
message GetClubRequest { string club_id = 1; }
message ClubStaff {
  string id = 1;
  optional string user_id = 2;
  string display_name = 3;
  string role = 4;
  optional string contact_email = 5;
  optional string contact_phone = 6;
}
message ClubSquad { string id = 1; string name = 2; string level = 3; optional string season = 4; optional string linked_team_id = 5; }
message Club {
  string id = 1; string name = 2; string city = 3;
  optional string description = 4;
  optional string contact_email = 5; optional string contact_phone = 6;
  optional string home_arena_id = 7;
  repeated string league_ids = 8; repeated string team_ids = 9;
  repeated ClubSquad squads = 10; repeated ClubStaff staff = 11;
}
message ClubStaffList { repeated ClubStaff items = 1; }
message UpdateClubRequest {
  string club_id = 1;
  optional string name = 2; optional string description = 3;
  optional string contact_email = 4; optional string contact_phone = 5;
  // Absent: unchanged; present with empty items: remove all contact staff.
  ClubStaffList staff = 6;
  repeated string clear_fields = 7;
}
message ClubProfileResponse { Club club = 1; }
message CreateStaffContactRequest {
  string team_id = 1; string name = 2; string email = 3; string message = 4;
  string idempotency_key = 5;
}
message StaffContact {
  string id = 1; string team_id = 2; string name = 3; string email = 4;
  string message = 5; google.protobuf.Timestamp created_at = 6;
}
message ListStaffContactsRequest { string team_id = 1; int32 limit = 2; int32 offset = 3; }
message StaffContactList { repeated StaffContact items = 1; int64 total = 2; int32 limit = 3; int32 offset = 4; }
message CheckTeamAccessRequest { string team_id = 1; string user_id = 2; string action = 3; }
message CheckClubAccessRequest { string club_id = 1; string user_id = 2; string action = 3; }
message AccessDecision { bool allowed = 1; }
message GetTeamMembersRequest { string team_id = 1; int32 limit = 2; int32 offset = 3; }
message GetClubTeamsRequest { string club_id = 1; int32 limit = 2; int32 offset = 3; }
message ClubTeamsResponse { repeated string team_ids = 1; int64 total = 2; int32 limit = 3; int32 offset = 4; }

message AcceptInviteRequest {
  string invite_id = 1;
}
