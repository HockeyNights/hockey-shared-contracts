syntax = "proto3";

package shop.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/HockeyNights/hockey-shared-contracts/shop/gen/go/v1;shopv1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "HockeyNights Shop API"
    version: "1.0.0"
    description: "Каталог магазинов и marketplace."
  }
};

service ShopService {
  rpc ListShops(ListShopsRequest) returns (ListShopsResponse) {
    option (google.api.http) = {get: "/v1/shops"};
  }
  rpc ListProductOffers(ListProductOffersRequest) returns (ListProductOffersResponse) {
    option (google.api.http) = {get: "/v1/product-offers"};
  }
  rpc UpdateShopPartnerProfile(UpdateShopPartnerProfileRequest) returns (Shop) {
    option (google.api.http) = {
      patch: "/v1/shops/{shop_id}/profile"
      body: "*"
    };
  }
  rpc CreateShopProduct(CreateShopProductRequest) returns (ProductOffer) {
    option (google.api.http) = {
      post: "/v1/shops/{shop_id}/products"
      body: "*"
    };
  }
  rpc UpdateShopProduct(UpdateShopProductRequest) returns (ProductOffer) {
    option (google.api.http) = {
      patch: "/v1/shops/{shop_id}/products/{product_id}"
      body: "*"
    };
  }
  rpc ListShopPromos(ListShopPromosRequest) returns (ListShopPromosResponse) {
    option (google.api.http) = {get: "/v1/shops/{shop_id}/promos"};
  }
  rpc CreateShopPromo(CreateShopPromoRequest) returns (ShopPromo) {
    option (google.api.http) = {
      post: "/v1/shops/{shop_id}/promos"
      body: "*"
    };
  }
  rpc GetMarketPlaceFeed(GetMarketPlaceFeedRequest) returns (GetMarketPlaceFeedResponse) {
    option (google.api.http) = {get: "/v1/marketplace"};
  }
}

message Shop {
  string id = 1;
  string name = 2;
  string city = 3;
  string website_url = 4;
  repeated string categories = 5;
  string partner_status = 6;
  bool visible = 7;
  string description = 8;
  string contact_email = 9;
  string contact_phone = 10;
  string delivery_info = 11;
  string pickup_info = 12;
  string moderation_status = 13;
  string ad_tier = 14;
  int32 ad_priority = 15;
}

message ListShopsRequest {
  string city = 1;
  string category = 2;
}

message ListShopsResponse {
  repeated Shop shops = 1;
}

message ProductOffer {
  string id = 1;
  string shop_id = 2;
  string title = 3;
  string category = 4;
  double price = 5;
  string currency = 6;
  string availability = 7;
  string external_url = 8;
  repeated string recommended_positions = 9;
  repeated string recommended_levels = 10;
  string image_url = 11;
  string moderation_status = 12;
}

message ListProductOffersRequest {
  string shop_id = 1;
}

message ListProductOffersResponse {
  repeated ProductOffer offers = 1;
}

message UpdateShopPartnerProfileRequest {
  string shop_id = 1;
  optional string name = 2;
  optional string city = 3;
  optional string website_url = 4;
  repeated string categories = 5;
  optional string description = 6;
  optional string contact_email = 7;
  optional string contact_phone = 8;
  optional string delivery_info = 9;
  optional string pickup_info = 10;
  optional bool visible = 11;
}

message CreateShopProductRequest {
  string shop_id = 1;
  string title = 2;
  string category = 3;
  double price = 4;
  string currency = 5;
  string availability = 6;
  string external_url = 7;
  repeated string recommended_positions = 8;
  repeated string recommended_levels = 9;
  string image_url = 10;
}

message UpdateShopProductRequest {
  string shop_id = 1;
  string product_id = 2;
  optional string title = 3;
  optional string category = 4;
  optional double price = 5;
  optional string currency = 6;
  optional string availability = 7;
  optional string external_url = 8;
  repeated string recommended_positions = 9;
  repeated string recommended_levels = 10;
  optional string image_url = 11;
}

message ShopPromo {
  string id = 1;
  string shop_id = 2;
  string title = 3;
  string subtitle = 4;
  optional int32 discount_percent = 5;
  repeated string target_positions = 6;
  bool active = 7;
}

message ListShopPromosRequest {
  string shop_id = 1;
}

message ListShopPromosResponse {
  repeated ShopPromo promos = 1;
}

message CreateShopPromoRequest {
  string shop_id = 1;
  string title = 2;
  string subtitle = 3;
  optional int32 discount_percent = 4;
  repeated string target_positions = 5;
  optional bool active = 6;
}

message GetMarketPlaceFeedRequest {
  string q = 1;
  string category = 2;
  string shop_id = 3;
  bool in_stock_only = 4;
  string position = 5;
  string sort = 6;
}

message MarketplaceShopSpotlight {
  Shop shop = 1;
  string promo_title = 2;
  optional int32 promo_discount = 3;
}

message MarketplaceProductListing {
  ProductOffer offer = 1;
  string shop_id = 2;
  string shop_name = 3;
  string shop_city = 4;
  string shop_ad_tier = 5;
  int32 shop_ad_priority = 6;
  bool is_promoted = 7;
  optional int32 promo_discount = 8;
}

message GetMarketPlaceFeedResponse {
  repeated MarketplaceShopSpotlight spotlight_shops = 1;
  repeated MarketplaceProductListing listings = 2;
  repeated string categories = 3;
}