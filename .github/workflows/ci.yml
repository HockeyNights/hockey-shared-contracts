name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Сборка сгенерированного кода
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Валидность .proto
        run: make check

  sync:
    name: gen/ совпадает с .proto
    runs-on: ubuntu-latest
    if: vars.CONTRACTS_SYNC_CHECK == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Перегенерировать и сравнить
        run: |
          make generate
          if ! git diff --quiet --exit-code; then
            echo "::error::gen/ разошёлся с .proto — выполните 'make generate' и закоммитьте результат"
            git diff --stat
            exit 1
          fi
          echo "сгенерированный код в актуальном состоянии"
